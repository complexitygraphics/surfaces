<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surfaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
  
  <style>
       #surfaces-root canvas { display:block; position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none; }
    #surfaces-root #title { position:absolute; left:28px; top:24px; max-width: calc(100% - 220px); color:#f4f7fb; font-family:"Cormorant Garamond", Georgia, serif; pointer-events:none; user-select:none; z-index:4; }
    #surfaces-root #title h1 { display:block !important; visibility:visible !important; opacity:1 !important; margin:0 !important; font-weight:400 !important; font-size:clamp(28px,4.2vw,52px) !important; letter-spacing:-0.02em !important; line-height:0.95 !important; color:#f4f7fb !important; overflow-wrap:break-word !important; word-break:break-word !important; }
    #surfaces-root #title p { margin:8px 0 0; font-family:Outfit,sans-serif; font-weight:300; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.55; }
    #surfaces-root #ui { position:absolute; left:0; right:0; bottom:0; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, rgba(5,6,12,0) 0%, rgba(5,6,12,0.03) 60%, rgba(5,6,12,0.06) 100%); color:#e8f2ff; user-select:none; z-index:6; }
    #surfaces-root #menuHead { display:flex; align-items:center; justify-content:space-between; margin:0 4px 10px; font-family:Outfit,sans-serif; }
    #surfaces-root #menuHead span { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.85; text-shadow:0 1px 6px rgba(0,0,0,0.85); }
    #surfaces-root #menuHead em { font-style:normal; opacity:0.6; margin-left:8px; letter-spacing:0.08em; }
    #surfaces-root #scroller { position:relative; }
    #surfaces-root #scroller::before, #surfaces-root #scroller::after { content:""; position:absolute; top:0; bottom:0; width:24px; z-index:2; pointer-events:none; }
    #surfaces-root #scroller::before { left:0;  background:linear-gradient(90deg, rgba(5,6,12,0.15), transparent); }
    #surfaces-root #scroller::after  { right:0; background:linear-gradient(270deg, rgba(5,6,12,0.15), transparent); }
    #surfaces-root #buttons { display:flex; gap:12px; overflow-x:auto; padding:8px 36px 12px; scroll-behavior:smooth; scrollbar-width:none; }
    #surfaces-root #buttons::-webkit-scrollbar { display:none; }
    #surfaces-root #buttons button { flex:0 0 auto; width:78px; padding:8px 6px 10px; background: rgba(255,255,255,0.03); backdrop-filter: blur(2px) saturate(130%); -webkit-backdrop-filter: blur(3px) saturate(130%); border: 1px solid rgba(255,255,255,0.13); border-top-color: rgba(255,255,255,0.07); border-radius:22px; cursor:pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.50), inset 0 -1px 0 rgba(255,255,255,0.08); transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease; -webkit-tap-highlight-color:transparent; }
    #surfaces-root #buttons button canvas { position:static; width:66px; height:66px; display:block; border-radius:14px; pointer-events:none; background:transparent; }
    #surfaces-root #buttons button span { display:block; margin-top:6px; text-align:center; font-family:Outfit,sans-serif; font-weight:400; font-size:10px; letter-spacing:0.03em; color:rgba(255,255,255,0.95); text-shadow:0 1px 4px rgba(0,0,0,0.85); }
    #surfaces-root #buttons button:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.45); border-top-color: rgba(255,255,255,0.7); }
    #surfaces-root #buttons button.active { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.6); border-top-color: rgba(255,255,255,0.85); box-shadow: 0 0 16px rgba(255,255,255,0.18), 0 3px 10px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1px 0 rgba(255,255,255,0.12); }
    #surfaces-root #buttons button.active span { color:#fff; }
    #surfaces-root #buttons button:active { transform:scale(0.95); }
    #surfaces-root .arrow { width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.20); background: rgba(255,255,255,0.055); backdrop-filter: blur(7px) saturate(150%); -webkit-backdrop-filter: blur(7px) saturate(150%); color: rgba(255,255,255,0.95); font-size:18px; line-height:1; cursor:pointer; padding:0; box-shadow: 0 3px 12px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.32), inset 0 -1px 0 rgba(255,255,255,0.06); transition: background 0.2s, border-color 0.2s, transform 0.1s, color 0.2s; -webkit-tap-highlight-color:transparent; }
    #surfaces-root .arrow:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.32); }
    #surfaces-root .arrow:active { transform:scale(0.92); }
    #surfaces-root #sound { position:absolute; right:20px; top:22px; z-index:2147483647; width:36px; height:36px; min-width:36px; min-height:36px; max-width:36px; max-height:36px; padding:0; box-sizing:border-box; border-radius:50%; aspect-ratio:1/1; background: rgba(255,255,255,0.03); backdrop-filter: blur(2px) saturate(130%); -webkit-backdrop-filter: blur(3px) saturate(130%); border: 1px solid rgba(255,255,255,0.13); border-top-color: rgba(255,255,255,0.07); color: rgba(255,255,255,0.95); cursor:pointer; pointer-events:auto; user-select:none; -webkit-tap-highlight-color:transparent; display:flex; align-items:center; justify-content:center; box-shadow: 0 3px 10px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.50), inset 0 -1px 0 rgba(255,255,255,0.08); transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s; }
    #surfaces-root #sound:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.45); border-top-color: rgba(255,255,255,0.7); }
    #surfaces-root #sound.on { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.6); border-top-color: rgba(255,255,255,0.85); color:#fff; box-shadow: 0 0 16px rgba(255,255,255,0.18), 0 3px 10px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1px 0 rgba(255,255,255,0.12); }
    #surfaces-root #sound svg { display:block; pointer-events:none; }
    #surfaces-root #sound .waves { opacity:0; transition: opacity 0.2s; }
    #surfaces-root #sound.on .waves { opacity:1; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { #surfaces-root #buttons button, #surfaces-root .arrow, #surfaces-root #sound { background: rgba(30,35,50,0.55); } }
    #surfaces-root #formula { position:absolute; top:118px; left:28px; right:28px; font-family:'EB Garamond','Cormorant Garamond',serif; font-style:italic; font-size:16px; font-weight:400; color:rgba(235,245,255,0.95); letter-spacing:0.02em; pointer-events:none; z-index:5; text-shadow:0 1px 10px rgba(0,0,0,0.9); }
    #surfaces-root #desc { position:absolute; bottom:240px; left:28px; right:28px; font-family:'Cormorant Garamond',serif; font-size:14px; font-weight:400; line-height:1.45; color:rgba(230,242,255,0.92); letter-spacing:0.01em; pointer-events:none; z-index:5; max-width:420px; text-shadow:0 1px 10px rgba(0,0,0,0.9); }
    #surfaces-root #palettes { position:absolute; right:68px; top:22px; height:36px; z-index:2147483646; display:flex; gap:10px; align-items:center; pointer-events:auto; }
    #surfaces-root #palettes button { box-sizing:border-box; width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); cursor:pointer; padding:0; box-shadow:0 0 8px rgba(0,0,0,0.45), inset 0 0 4px rgba(255,255,255,0.25); transition:transform 0.15s, border-color 0.15s, box-shadow 0.15s; pointer-events:auto; user-select:none; -webkit-tap-highlight-color:transparent; background-size:100% 100%; }
    @keyframes palettePulse { 0%, 100% { box-shadow: 0 0 18px rgba(255,220,160,1), 0 0 42px rgba(255,180,90,0.85), 0 0 76px rgba(255,140,40,0.50), 0 0 120px rgba(255,120,20,0.25), inset 0 0 6px rgba(255,255,255,0.7); } 50% { box-shadow: 0 0 30px rgba(255,240,200,1), 0 0 72px rgba(255,205,130,1), 0 0 130px rgba(255,165,65,0.85), 0 0 185px rgba(255,135,35,0.45), inset 0 0 10px rgba(255,255,255,0.95); } }
    #surfaces-root #palettes button.active { border-color:#fff; transform:scale(1.18); animation: palettePulse 2.4s ease-in-out infinite; }
    @media (max-width: 700px) { #surfaces-root #palettes { top: 20px; right: 62px; height: 36px; gap: 8px; } #surfaces-root #palettes button { width: 18px; height: 18px; border-width: 1.5px; } #surfaces-root #sound { top: 20px; right: 18px; } #surfaces-root #title { top: 24px; max-width: calc(100% - 160px); } #surfaces-root #title h1 { font-size: clamp(28px, 8.2vw, 42px) !important; } #surfaces-root #formula { font-size: 13px; top: 106px; } }
    @media (max-height: 520px) and (orientation: landscape) {
      #surfaces-root #title { top: 12px; left: 18px; max-width: calc(100% - 200px); }
      #surfaces-root #title h1 { font-size: clamp(20px, 3.5vw, 30px) !important; }
      #surfaces-root #title p { font-size: 10px; margin-top: 4px; letter-spacing: 0.14em; }
      #surfaces-root #formula { top: 78px; font-size: 12px; }
      #surfaces-root #desc { bottom: 118px; font-size: 11px; max-width: 300px; line-height: 1.35; }
      #surfaces-root #ui { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
      #surfaces-root #menuHead { margin-bottom: 6px; }
      #surfaces-root #buttons { padding: 4px 30px 8px; gap: 8px; }
      #surfaces-root #buttons button { width: 58px; padding: 5px 4px 7px; border-radius: 16px; }
      #surfaces-root #buttons button canvas { width: 46px; height: 46px; }
      #surfaces-root #buttons button span { font-size: 9px; margin-top: 3px; }
      #surfaces-root #palettes { top: 10px; right: 58px; height: 30px; gap: 6px; }
      #surfaces-root #palettes button { width: 16px; height: 16px; border-width: 1.5px; }
      #surfaces-root #sound { top: 10px; right: 12px; width: 30px; height: 30px; min-width:30px; min-height:30px; max-width:30px; max-height:30px; }
      #surfaces-root #sound svg { width: 14px; height: 14px; }
    }
    body { margin: 0; padding: 0; background: #05060c; overflow: hidden; }
  </style>
</head>
<body>
  <div id="surfaces-root" style="position:relative;width:100%;height:100vh;height:100dvh;min-height:400px;overflow:hidden;">
    <div id="palettes"></div>
    <div id="title">
      <h1 id="surf-name">Mobius</h1>
      <p>Drag to rotate · Pinch to zoom · Forms grow and settle</p>
      <div id="formula"></div>
    </div>
    <div id="desc"></div>
    <button id="sound" type="button" aria-label="Sound">
      <svg viewBox="0 0 24 24" width="17" height="17">
        <path d="M4 9v6h3.2l5 4V5l-5 4H4z" fill="currentColor"/>
        <path class="waves" d="M15.5 8.6a5 5 0 0 1 0 6.8 M18.4 5.6a9 9 0 0 1 0 12.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="ui">
      <div id="menuHead">
        <span>Surfaces <em id="count"></em></span>
        <span>
          <button class="arrow" id="prev" type="button">‹</button>
          <button class="arrow" id="next" type="button">›</button>
        </span>
      </div>
      <div id="scroller"><div id="buttons"></div></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script>
    (function stripDuplicates() {
      const all = document.querySelectorAll('[id="surfaces-root"]');
      for (let i = all.length - 1; i > 0; i--) all[i].remove();
    })();

    const root = document.getElementById('surfaces-root');
    if (!root) throw new Error('surfaces-root not found');

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x05060c, 1);
    root.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(3.4, 2.6, 3.8);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;
    controls.enablePan = false;

    const AUTO_FIT_FILL = 0.65;
    function autoFitHalfHeight() {
      const D = camera.position.length();
      return Math.tan((camera.fov * Math.PI / 180) / 2) * D;
    }
    function autoFitScaleFromRadius(radius) {
      return (autoFitHalfHeight() * AUTO_FIT_FILL) / Math.max(radius, 0.01);
    }
    function measureSurfaceRadius() {
      surface.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(surface);
      if (box.isEmpty()) return 1;
      const s = new THREE.Sphere();
      box.getBoundingSphere(s);
      return Math.max(s.radius, 0.01);
    }

    function resize() {
      const vv = window.visualViewport;
      const w = root.clientWidth  || (vv ? vv.width  : window.innerWidth);
      const h = root.clientHeight || (vv ? vv.height : window.innerHeight);
      if (w <= 0 || h <= 0) return;
      renderer.setSize(w, h, false);
      renderer.domElement.style.width  = '100%';
      renderer.domElement.style.height = '100%';
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    scene.add(new THREE.AmbientLight(0x223344, 0.45));
    const key = new THREE.PointLight(0xc8f0ff, 26, 24);
    key.position.set(2, 3, 2);
    scene.add(key);

    const softDot = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grd.addColorStop(0,    'rgba(255,255,255,1)');
      grd.addColorStop(0.08, 'rgba(255,248,230,0.85)');
      grd.addColorStop(0.22, 'rgba(255,236,190,0.35)');
      grd.addColorStop(0.5,  'rgba(255,220,160,0.08)');
      grd.addColorStop(1,    'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    })();

    const starCount = 4000;
    const starPos = new Float32Array(starCount * 3);
    const starColorArr = new Float32Array(starCount * 3);
    const goldWarm   = new THREE.Color(0xffd18a);
    const goldDeep   = new THREE.Color(0xffb060);
    const coolBlue   = new THREE.Color(0xb8d4ff);
    const coolViolet = new THREE.Color(0xc9b0ff);
    for (let i = 0; i < starCount; i++) {
      const r = 10 + Math.pow(Math.random(), 0.7) * 55;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      starPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      starPos[i*3+1] = r * Math.cos(ph);
      starPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
      const pick = Math.random();
      let base;
      if (pick < 0.55)      base = goldWarm;
      else if (pick < 0.75) base = goldDeep;
      else if (pick < 0.9)  base = coolBlue;
      else                  base = coolViolet;
      const bright = 0.5 + Math.pow(Math.random(), 1.4) * 1.0;
      starColorArr[i*3]   = base.r * bright;
      starColorArr[i*3+1] = base.g * bright;
      starColorArr[i*3+2] = base.b * bright;
    }
    const starsGeo = new THREE.BufferGeometry();
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starsGeo.setAttribute('color', new THREE.BufferAttribute(starColorArr, 3));
    const starsMat = new THREE.PointsMaterial({ map: softDot, vertexColors: true, size: 0.65, transparent: true, opacity: 0.76, sizeAttenuation: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    const dustCount = 90;
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      const r = 10 + Math.pow(Math.random(), 0.7) * 55;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      dustPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      dustPos[i*3+1] = r * Math.cos(ph);
      dustPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    }
    const dustMat = new THREE.PointsMaterial({ map: softDot, color: 0xffdca0, size: 0.85, transparent: true, opacity: 0.52, sizeAttenuation: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending });
    const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(dustPos, 3)), dustMat);
    scene.add(dust);

    scene.fog = new THREE.FogExp2(0x05060c, 0.04);

    const palettes = {
      Sunset: [ new THREE.Color(0x2d3b22), new THREE.Color(0x4e6b42), new THREE.Color(0x687d47), new THREE.Color(0x7d4522), new THREE.Color(0xec5c3c), new THREE.Color(0xec5c3c), new THREE.Color(0xf28e61), new THREE.Color(0xb87333), new THREE.Color(0x4e6b42), new THREE.Color(0x2d3b22), new THREE.Color(0x2eb8b8) ],
      Ocean:  [ new THREE.Color(0x3a5eff), new THREE.Color(0x2266ff), new THREE.Color(0x3cbdd7), new THREE.Color(0x3a6b2e), new THREE.Color(0xb85a26) ],
      Mono:   [ new THREE.Color(0x000000), new THREE.Color(0x9d9db1), new THREE.Color(0xffffff) ],
      Emerald: [ new THREE.Color(0x0466c8), new THREE.Color(0x2ec4b6), new THREE.Color(0x8af0d1), new THREE.Color(0x1b7342), new THREE.Color(0x0b3d2e), new THREE.Color(0xb87333), new THREE.Color(0x55a630), new THREE.Color(0x2ec4b6), new THREE.Color(0x2b9348) ]
    };
    let palette = palettes.Ocean;

    function colorAt(u, v) {
      const t = Math.max(0, Math.min(1, u * 0.65 + v * 0.35));
      const c = new THREE.Color();
      const n = palette.length;
      if (n === 3) {
        c.copy(palette[0]).lerp(palette[1], Math.min(1, t * 1.4));
        c.lerp(palette[2], Math.max(0, t - 0.35) * 0.9);
      } else {
        const scaled = t * (n - 1);
        const i = Math.floor(scaled);
        const f = scaled - i;
        const smooth = f * f * (3 - 2 * f);
        c.copy(palette[i]).lerp(palette[Math.min(i + 1, n - 1)], smooth);
      }
      return c;
    }

    function build(nu, nv, fn, closeV = false, dotStride = 2) {
      const positions = [], colors = [], indices = [];
      const dots = [], dotColors = [];
      for (let j = 0; j <= nv; j++) {
        for (let i = 0; i <= nu; i++) {
          const u = i / nu, v = j / nv;
          const p = fn(u, v);
          positions.push(p.x, p.y, p.z);
          const c = colorAt(u, v);
          colors.push(c.r, c.g, c.b);
          if (i % dotStride === 0 && j % dotStride === 0) {
            dots.push(p.x, p.y, p.z);
            dotColors.push(c.r, c.g, c.b);
          }
        }
      }
      for (let j = 0; j < nv; j++) {
        for (let i = 0; i < nu; i++) {
          const a = j * (nu + 1) + i;
          indices.push(a, a + 1, a, a + nu + 1);
        }
      }
      if (closeV) {
        for (let i = 0; i < nu; i++) {
          const a = nv * (nu + 1) + i;
          indices.push(a, i);
        }
      }
      const edge = [], edgeColors = [];
      for (let i = 0; i <= nu; i += 3) { const p = fn(i / nu, 1); edge.push(p.x, p.y, p.z); const c = colorAt(i / nu, 1); edgeColors.push(c.r, c.g, c.b); }
      for (let j = 0; j <= nv; j += 3) { const p = fn(1, j / nv); edge.push(p.x, p.y, p.z); const c = colorAt(1, j / nv); edgeColors.push(c.r, c.g, c.b); }
      const rim = [], rimColors = [];
      const pushRim = (uu, vv) => { const p = fn(uu, vv); rim.push(p.x, p.y, p.z); const c = colorAt(uu, vv); rimColors.push(c.r, c.g, c.b); };
      for (let i = 0; i <= nu; i++) pushRim(i / nu, 0);
      for (let j = 1; j <= nv; j++) pushRim(1, j / nv);
      for (let i = nu - 1; i >= 0; i--) pushRim(i / nu, 1);
      for (let j = nv - 1; j >= 1; j--) pushRim(0, j / nv);
      const corners = [], cornerColors = [];
      [[0,0],[1,0],[1,1],[0,1]].forEach(([uu, vv]) => { const p = fn(uu, vv); corners.push(p.x, p.y, p.z); const c = colorAt(uu, vv); cornerColors.push(c.r, c.g, c.b); });

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);

      const dotGeo = new THREE.BufferGeometry();
      dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dots, 3));
      dotGeo.setAttribute('color', new THREE.Float32BufferAttribute(dotColors, 3));

      const edgeGeo = new THREE.BufferGeometry();
      edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edge, 3));
      edgeGeo.setAttribute('color', new THREE.Float32BufferAttribute(edgeColors, 3));

      const rimGeo = new THREE.BufferGeometry();
      rimGeo.setAttribute('position', new THREE.Float32BufferAttribute(rim, 3));

    const PHI = (1 + Math.sqrt(5)) / 2;

  const BARTH_NU = 240;

  const BASE_KUMMER_DOT = 0.078;
  const kDotMat = new THREE.PointsMaterial({ size: BASE_KUMMER_DOT, map: softDot, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });

  function kummerLargestRoot(A, lambda) {

    const shift = p1 / 3;

    const hq = q * 0.5, tp = p / 3;
    const Delta = hq * hq + tp * tp * tp;

        kDotPosArr[dotPtr*3+1] = kPosArr[idx*3+1];
        kDotPosArr[dotPtr*3+2] = kPosArr[idx*3+2];
        kDotColArr[dotPtr*3]   = kColArr[idx*3];

    let edgePtr = 0;
    for (let j = 1; j < KUMMER_NV; j++) {

      for (let i = 0; i < KUMMER_NU; i++) {

        const hasD = kValidArr[prevRow + i], hasU = kValidArr[nextRow + i];
        if (!hasL || !hasR || !hasD || !hasU) {
          if (edgePtr >= KUMMER_VERTS) break;
          kEdgePosArr[edgePtr*3]   = kPosArr[idx*3];

          kEdgeColArr[edgePtr*3+1] = kColArr[idx*3+1];

  function cayleyLargestRoot(A, c) {

  function clebschLargestRoot(a, b, c) {

    const Delta = hq * hq + tp * tp * tp;
    let best = -1;
    if (Delta > 1e-12) {

  const lGeom = new THREE.BufferGeometry();

  const lColAttr = new THREE.BufferAttribute(lColArr, 3).setUsage(THREE.DynamicDrawUsage);
  const lIdxAttr = new THREE.BufferAttribute(lIdxArr, 1).setUsage(THREE.DynamicDrawUsage);
  lGeom.setAttribute('position', lPosAttr);

  const lLineMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending, depthWrite: false });

  function rebuildLopezColors() {

    function lopezPoint(zr, zi, e) {
    const e2 = e * e, e4 = e2 * e2;
    const z2r = zr * zr - zi * zi;
    const z2i = 2 * zr * zi;
    const z3r = z2r * zr - z2i * zi;
    const z3i = z2r * zi + z2i * zr;

    const wr = z2r - e2;
    const wi = z2i;
    const wm2 = wr * wr + wi * wi;
    if (!(wm2 > 1e-14)) return null;
    
    const invwr = wr / wm2, invwi = -wi / wm2;
    const ziwr = zr * invwr - zi * invwi;
    const ziwim = zr * invwi + zi * invwr;

    const ar = zr - e, ai = zi;
    const br = zr + e, bi = zi;
    const bm2 = br * br + bi * bi;
    if (!(bm2 > 1e-14)) return null;
    
    const rr = (ar * br + ai * bi) / bm2;
    const ri = (ai * br - ar * bi) / bm2;
    const rm2 = rr * rr + ri * ri;
    if (!(rm2 > 1e-14)) return null;
    
    const Lre = 0.5 * Math.log(rm2);
    const Lim = Math.atan2(ri, rr);

    // Z = Re(Integral of G*dh)
    const J1re = (zr + 0.5 * e * Lre) / (2 * e2);

    // X + iY = Integral of (1-G^2)dh / 2
    const term1re = Lre / (8 * e);
    const term1im = Lim / (8 * e);
    const term2re = -ziwr / 4;
    const term2im = -ziwim / 4;
    const term3re = -z3r / (24 * e4);
    const term3im = -z3i / (24 * e4);

    const X = term1re + term2re + term3re;
    const Y = term1im + term2im + term3im;
    const Z = J1re;

    if (!isFinite(X) || !isFinite(Y) || !isFinite(Z)) return null;
    return [X, Y, Z];
  }

  function updateLopez(e) {
    const RIN2 = LOPEZ_RIN * LOPEZ_RIN;
    const ROUT2 = LOPEZ_ROUT * LOPEZ_ROUT;
    for (let j = 0; j < LOPEZ_NV1; j++) {
      const th = (j / LOPEZ_NV) * Math.PI;
      const s = (j === LOPEZ_NV) ? 1e9 : Math.tan(th * 0.5);

      for (let i = 0; i < LOPEZ_NU1; i++) {

        const idx = base + i;
        const dp = (zr - e) * (zr - e) + zi * zi;
        const dm = (zr + e) * (zr + e) + zi * zi;
        const r2 = zr * zr + zi * zi;
        let ok = isFinite(zr) && isFinite(zi) && dp >= RIN2 && dm >= RIN2 && r2 <= ROUT2;
        let p = null;
        if (ok) p = lopezPoint(zr, zi, e);

          const dy = lPosArr[idx2*3+1] - lPosArr[idx1*3+1];
          const dz = lPosArr[idx2*3+2] - lPosArr[idx1*3+2];
          if (dx*dx + dy*dy + dz*dz < MAX_DIST_SQ) {
            lIdxArr[ptr++] = idx1; lIdxArr[ptr++] = idx2;
          }
        }

    }
    for (let j = 0; j < LOPEZ_NV; j++) {
      const base = j * LOPEZ_NU1, next = (j + 1) * LOPEZ_NU1;
      for (let i = 0; i < LOPEZ_NU1; i++) {
        const idx1 = base + i;
        const idx2 = next + i;
        if (lValidArr[idx1] && lValidArr[idx2]) {
          const dx = lPosArr[idx2*3] - lPosArr[idx1*3];
          const dy = lPosArr[idx2*3+1] - lPosArr[idx1*3+1];
          const dz = lPosArr[idx2*3+2] - lPosArr[idx1*3+2];

    let dotPtr = 0;

      const base = j * LOPEZ_NU1;

        lDotPosArr[dotPtr*3]   = lPosArr[idx*3];
        lDotPosArr[dotPtr*3+1] = lPosArr[idx*3+1];
        lDotPosArr[dotPtr*3+2] = lPosArr[idx*3+2];

          lEdgeColArr[edgePtr*3+1] = lColArr[idx*3+1];
          lEdgeColArr[edgePtr*3+2] = lColArr[idx*3+2];

        }

  const formulas = {
    'Mobius': (u, v, k = 0) => {
      const t = u * Math.PI * 2;
      const w = (v - 0.5) * (mobiusWidth + 0.2 * k);
      const flow = Math.sin(t * 0.5) * 0.08 * k;
      const twist = t / 2 + flow + (0.08 + 0.25 * k) * Math.sin(t);
      const r = 1.15 + w * Math.cos(twist) + 0.04 * k * Math.sin(t * 2);
      return new THREE.Vector3(r * Math.cos(t), w * Math.sin(twist) * 0.85 + 0.06 * Math.sin(t * 3) * k, r * Math.sin(t));
    },
    'Enneper': (u, v, k = 0) => {
      const sc = enneperScale;
      const x = (u - 0.5) * 2.8 * sc;
      const y = (v - 0.5) * 2.8 * sc;
      const ripple = (0.04 + 0.22 * k) * Math.sin(x * (1.5 + k * 2)) * Math.cos(y * (1.5 + k * 2));
      return new THREE.Vector3(x - x*x*x/3 + x*y*y, y - y*y*y/3 + y*x*x, x*x - y*y + ripple).multiplyScalar(0.42);
    },
    'Dini': (u, v, k = 0) => {
      const a = 1, b = diniB + 0.04 * k;
      const uu = 0.15 + u * (3.2 + k * 0.9);
      const vv = v * Math.PI * 2;
      return new THREE.Vector3(a*Math.cos(vv)*Math.sin(uu), a*Math.sin(vv)*Math.sin(uu), a*(Math.cos(uu)+Math.log(Math.tan(uu/2))) + b*vv).multiplyScalar(0.36);
    },
    'Kuen': (u, v, k = 0) => {
      const uu = 0.2 + u * (2.5 + k * 0.6);
      const vv = (v - 0.5) * Math.PI * (1.4 + 0.3 * k);
      const s2 = Math.sin(vv) * Math.sin(vv);
      const r = 2 / (1 + uu * uu * s2);
      const x = r * (Math.cos(vv) + uu * Math.sin(vv)) * Math.sin(uu);
      const y = r * (Math.sin(vv) - uu * Math.cos(vv)) * Math.sin(uu);
      const logTerm = Math.log(Math.max(0.01, Math.tan(uu / 2)));
      const z = r * (logTerm + uu * Math.cos(vv) / Math.max(0.1, Math.sin(uu)));
      const wave = (0.06 + 0.12 * k) * Math.sin(uu * 2) * Math.cos(vv);
      return new THREE.Vector3(x * 0.35, z * 0.2 + wave, y * 0.35);
    },
    'Scherk': (u, v, k = 0) => {
      const x = (u - 0.5) * 2.3; const y = (v - 0.5) * 2.3;
      const cx = Math.max(0.14, Math.abs(Math.cos(x)));
      const cy = Math.max(0.14, Math.abs(Math.cos(y)));
      const z = Math.log(cy / cx);
      const twist = (0.35 + 1.1 * k) * Math.atan2(y, x) + (0.1 + 0.4 * k) * Math.hypot(x, y);
      const c = Math.cos(twist), s = Math.sin(twist);
      return new THREE.Vector3((c*x - s*y)*0.58, z*(0.28 + 0.18*k), (s*x + c*y)*0.58);
    },
    'Scherk2': (u, v, k = 0.5) => {
      const alpha = 0.3 + 1.2 * k;
      const beta  = 0.1 + 0.8 * k;
      const uu = (-0.75 + 1.5 * u) * Math.PI;
      const vv = (-2.0  + 4.0 * v) * Math.PI;
      const au = alpha * uu;
      const av = alpha * vv;
      const cosh_au = Math.cosh(au);
      const sinh_au = Math.sinh(au);
      const cos_av  = Math.cos(av);
      const sin_av  = Math.sin(av);
      const sqrt_1pb2 = Math.sqrt(1 + beta * beta);
      const inv_a2 = 1 / (alpha * alpha);
      const xB = inv_a2 * (alpha * beta * uu + sqrt_1pb2 * sinh_au * cos_av);
      const yB = inv_a2 * (alpha * sqrt_1pb2 * vv + beta * cosh_au * sin_av);
      const zB = inv_a2 * sinh_au * sin_av;
      return new THREE.Vector3(xB, zB, yB);
    },
    'Three-Soliton': (u, v, k = 0) => {
      const spread = threeSolitonSpread;
      const a = 0.5;
      const b = 0.5 + 0.45 * spread;
      const c = 0.5 - 0.45 * spread;
      const wa = Math.sqrt(1 - a * a), wb = Math.sqrt(1 - b * b), wc = Math.sqrt(1 - c * c);
      const t = 0.10 + u * 3.4; const p = (v - 0.5) * 2.0 * Math.PI;
      const sinT = Math.sin(t), cosT = Math.cos(t), sinP = Math.sin(p), cosP = Math.cos(p);
      const D = 1 + t * t * sinP * sinP;
      const kx = 2 * (cosP + t * sinP) * sinT / D;
      const kz = 2 * (sinP - t * cosP) * sinT / D;
      const ky = Math.log(Math.max(0.01, Math.tan(t / 2))) + 2 * t * cosP / D;
      const qa = a * t + wa * p, qb = b * t + wb * p, qc = c * t + wc * p;
      const A = 0.5 * (0.55 + 0.45 * k);
      const phi = A * Math.sin(qa) + A * Math.sin(qb) + A * Math.sin(qc);
      const phiXZ = phi * 0.6;
      const cP = Math.cos(phiXZ), sP = Math.sin(phiXZ);
      const cx = kx * cP - kz * sP;
      const cz = kx * sP + kz * cP;
      const scale = 0.5;
      const yLift = (0.35 + 0.25 * k) * phi;
      return new THREE.Vector3(cx * scale, (ky + yLift) * scale * 0.45, cz * scale);
    },
    'Four-Soliton': (u, v, k = 0) => {
      const s = fourSolitonSpread;
      const alphas = [
        0.6 - 0.25 * s,
        0.6 - 0.10 * s,
        0.6 + 0.05 * s,
        0.6 + 0.25 * s,
      ];
      const omegas = alphas.map(a => Math.sqrt(1 - a * a));
      const shifts = [0.0, 0.35, -0.45, 0.15];
      const t = 0.15 + u * 3.3; const p = (v - 0.5) * 2.4 * Math.PI;
      const th = alphas.map((a, i) => a * t + omegas[i] * p + shifts[i]);
      const A = (i, j) => { const d = (alphas[i] - alphas[j]) / (alphas[i] + alphas[j]); return d * d; };
      let tau = 1, tauP = 1;
      for (let m = 1; m < 16; m++) {
        let e = 0, c = 1, cnt = 0;
        const bits = [];
        for (let i = 0; i < 4; i++) if (m & (1 << i)) { bits.push(i); cnt++; }
        for (const i of bits) e += th[i];
        for (let a = 0; a < bits.length; a++) for (let b = a + 1; b < bits.length; b++) c *= A(bits[a], bits[b]);
        const term = c * Math.exp(e);
        tau += term; tauP += (cnt & 1 ? -1 : 1) * term;
      }
      const qRaw = 4 * Math.atan(tauP / tau);
      const qS = Math.tanh(qRaw * 0.55) * 2.2;
      const sq = Math.sin(qS), cq = Math.cos(qS);
      const D = 1 + t * t * Math.sin(p) * Math.sin(p) * 0.3;
      const kx = 2 * (Math.cos(p) + 0.5 * t * Math.sin(p)) * Math.sin(t) / D;
      const kz = 2 * (Math.sin(p) - 0.5 * t * Math.cos(p)) * Math.sin(t) / D;
      const ky = Math.log(Math.max(0.01, Math.tan(t / 2))) + 2 * t * Math.cos(p) / D;
      const tw = 1.00 * qS + 0.18 * t + 0.12 * k;
      const cw = Math.cos(tw), sw = Math.sin(tw);
      const rx = kx * cw - kz * sw, rz = kx * sw + kz * cw;
      const swell = 1 + 0.36 * cq + 0.20 * sq + 0.08 * k * Math.sin(2 * p);
      const yMod = ky * 0.40 + 0.36 * Math.sin(qS + 0.4 * p) + 0.18 * Math.cos(2 * qS - 1.0 * p) + 0.09 * Math.sin(3 * p + 0.4 * qS) + 0.11 * k * Math.sin(2 * p + qS);
      return new THREE.Vector3(rx * swell, yMod, rz * swell).multiplyScalar(0.55);
    },
    'Breather': (u, v, k = 0) => {
      const aa = 0.35 + 0.40 * k; const w = Math.sqrt(1 - aa * aa);
      const xi = (u - 0.5) * 9.0; const vv = v * Math.PI * 4.0;
      const cu = Math.cosh(xi), su = Math.sinh(xi);
      const sw = Math.sin(w * vv), cw = Math.cos(w * vv);
      const sv = Math.sin(vv), cv = Math.cos(vv);
      const den = (w * cu) * (w * cu) + (aa * sw) * (aa * sw);
      const x = -xi + 2 * (1 - aa * aa) * cu * su / den;
      const y = 2 * w * cu * (-(w * cv * cw) - sv * sw) / den;
      const z = 2 * w * cu * (-(w * sv * cw) + cv * sw) / den;
      return new THREE.Vector3(x, y + 1.35, z + 0.55).multiplyScalar(0.80);
    },
    'Catalan': (u, v, k = 0) => {
      const uu = (u - 0.5) * Math.PI * (2.2 + 0.6 * k);
      const vv = (v - 0.5) * catalanStretch;
      const ch = Math.cosh(vv);
      const x = uu - Math.sin(uu) * ch;
      const y = 1 - Math.cos(uu) * ch;
      const z = 4 * Math.sin(uu/2) * Math.sinh(vv/2);
      const a = 0.12 + 0.55 * k;
      const curl = a * Math.sin(uu*1.4) * Math.tanh(vv*1.2);
      const ridge = a * 0.7 * Math.cos(uu*0.8) * Math.sin(vv*1.6);
      const braid = a * 0.45 * Math.sin(uu*2.1 + vv*1.3);
      const tw = (0.15 + 0.45 * k) * Math.sin(uu * 0.4);
      const c = Math.cos(tw), s = Math.sin(tw);

      return new THREE.Vector3(c*px - s*pz, py, s*px + c*pz).multiplyScalar(0.42);

    'Square root': (u, v, k = 0) => {

    'López Klein': (u, v, k = 0.5) => {
      const A = 5.0, B = 22.0, D = 5.3;
      const C = 0.15 + 0.7 * k;
      const U = 3.0 + u * (2 * Math.PI - 3.0);
      const V = v * 2 * Math.PI;
      const cosU = Math.cos(U), sinU = Math.sin(U);
      const cosV = Math.cos(V), sinV = Math.sin(V);
      const sin2V = Math.sin(2 * V);

      const vv = v * Math.PI * 2;

      const ca = 2 * Math.cos(aa * Math.PI) / 1.01;
      const sa = 2 * Math.sin(aa * Math.PI) / 1.01;

      const sh1 = Math.sinh(uu), ch1 = Math.cosh(uu);

      const ch2 = Math.cosh(2 * uu), sh2 = Math.sinh(2 * uu);
      const cv2 = Math.cos(2 * vv), sv2 = Math.sin(2 * vv);

      const x = ca * (sh1 * cv - sh3 * cv3 / 3) + sa * (ch1 * sv - ch3 * sv3 / 3);

  function iconFor(fn) {
    const c = document.createElement('canvas');
    c.width = c.height = 144;
    const g = c.getContext('2d');
    const pts = [];
    const nu = 22, nv = 14;
    for (let j = 0; j <= nv; j++) {
      for (let i = 0; i <= nu; i++) {
        const p = fn(i / nu, j / nv);
        const yaw = 0.6, pitch = 0.35;
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const xr = cy * p.x + sy * p.z;
        const zr = -sy * p.x + cy * p.z;
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const yr = cp * p.y - sp * zr;
        pts.push([xr, yr]);
      }
    }
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    pts.forEach(([x, y]) => {
      if (!isFinite(x) || !isFinite(y)) return;
      if (Math.abs(x) > 20 || Math.abs(y) > 20) return;
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    });
    if (maxX === -1e9) { minX = -1; maxX = 1; minY = -1; maxY = 1; }
    const s = 100 / Math.max(maxX - minX, maxY - minY);
    const ox = 72 - (minX + maxX) * 0.5 * s;
    const oy = 72 + (minY + maxY) * 0.5 * s;
    g.strokeStyle = 'rgba(255,255,255,0.85)';
    g.lineWidth = 1.2;
    const at = (i, j) => { const [x, y] = pts[j * (nu + 1) + i]; return [ox + x * s, oy - y * s]; };
    g.beginPath();
    for (let j = 0; j <= nv; j += 2) for (let i = 0; i <= nu; i++) { const [x, y] = at(i, j); if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    for (let i = 0; i <= nu; i += 2) for (let j = 0; j <= nv; j++) { const [x, y] = at(i, j); if (j === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    g.stroke();
    return c;
  }

      const sp = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      bourTwist = sp * Math.PI;
      if (Math.abs(t - lastBourFormula) > 0.12) {
        lastBourFormula = t;
        setFormula('Bour');
      }
    }
    if (currentName === 'López–Ros') {
      if (lopezStartT < 0) lopezStartT = t;
      const phase = ((t - lopezStartT) % LOPEZ_PERIOD) / LOPEZ_PERIOD;
      const sp = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      
      lopezE = 0.65 + 0.20 * sp;
      
      if (Math.abs(t - lastLopezFormula) > 0.12) {
        lastLopezFormula = t;
        setFormula('López–Ros');
      }
    }
    if (currentName === 'Kummer Surface') {
      if (kummerStartT < 0) kummerStartT = t;
      const phase = ((t - kummerStartT) % KUMMER_PERIOD) / KUMMER_PERIOD;
      const sp = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      kummerLambda = KUMMER_LAMBDA_MIN + (KUMMER_LAMBDA_MAX - KUMMER_LAMBDA_MIN) * sp;
      if (Math.abs(t - lastKummerFormula) > 0.12) {
        lastKummerFormula = t;
        setFormula('Kummer Surface');
      }
    }

    if (master && audioCtx && soundOn) {
      const base = currentProfile.vol;
      master.gain.setTargetAtTime(base + base * 0.6 * glowBoost, audioCtx.currentTime, 0.15);
      if (window._noiseFilter && !barthActive && !cayleyActive && !clebschActive && !kummerActive) {
        if (currentName === 'Scherk2') {
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.65 + 0.7 * k), audioCtx.currentTime, 0.3);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.8 + 0.7 * k), audioCtx.currentTime, 0.3);
        } else if (currentName === 'López Klein') {
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.75 + 0.55 * k), audioCtx.currentTime, 0.3);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.8 + 0.55 * k), audioCtx.currentTime, 0.3);
        } else if (currentName === 'Boys Surface') {
          const n = (boysRmin - BOYS_RMIN_MIN) / (BOYS_RMIN_MAX - BOYS_RMIN_MIN);
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (1.0 + 0.30 * n), audioCtx.currentTime, 0.25);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (1.0 + 0.50 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Mobius') {
          const n = (mobiusWidth - 0.35) / 0.50;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.75 + 0.55 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Enneper') {
          const n = (enneperScale - 0.85) / 0.25;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.70 + 0.60 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Dini') {
          const n = (diniB - 0.10) / 0.32;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.80 + 0.50 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Catalan') {
          const n = (catalanStretch - 0.90) / 1.10;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.65 + 0.70 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Whitney') {
          const n = (whitneySharp - 0.70) / 0.70;
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.80 + 0.60 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Square root') {
          const n = (sqrtLift - 0.15) / 0.55;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.85 + 0.40 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Klein') {
          const n = (kleinAmp - 0.65) / 0.50;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.70 + 0.60 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Boy') {
          const n = (boySpike - 0.80) / 0.80;
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.80 + 0.70 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Three-Soliton') {
          const n = (threeSolitonSpread - 0.02) / 0.83;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.85 + 0.40 * n), audioCtx.currentTime, 0.25);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.85 + 0.35 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Four-Soliton') {
          const n = (fourSolitonSpread - 0.65) / 0.55;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.75 + 0.50 * n), audioCtx.currentTime, 0.25);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.80 + 0.60 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Henneberg') {
          const n = Math.sin(hennebergAA * Math.PI);
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.85 + 0.35 * n), audioCtx.currentTime, 0.25);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.90 + 0.40 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'Bour') {
          const n = bourTwist / Math.PI;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.8 + 0.5 * n), audioCtx.currentTime, 0.25);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.8 + 0.4 * n), audioCtx.currentTime, 0.25);
        } else if (currentName === 'López–Ros') {
          const n = (lopezE - 0.72) / 0.56;
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.80 + 0.50 * n), audioCtx.currentTime, 0.25);
          window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.85 + 0.40 * n), audioCtx.currentTime, 0.25);
        } else {
          window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (1 + 0.3 * glowBoost), audioCtx.currentTime, 0.2);
        }
      } else if (window._noiseFilter && barthActive) {
        window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.9 + 0.3 * (barthW - 0.95)), audioCtx.currentTime, 0.3);
      } else if (window._noiseFilter && cayleyActive) {
        const ct = cayleyC / 16;
        window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.55 + 0.85 * ct), audioCtx.currentTime, 0.25);
        window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.7 + 0.9 * ct), audioCtx.currentTime, 0.25);
      } else if (window._noiseFilter && clebschActive) {
        window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (1 + 0.10 * glowBoost), audioCtx.currentTime, 0.25);
      } else if (window._noiseFilter && kummerActive) {
        const n = kummerLambda / KUMMER_LAMBDA_MAX;
        window._noiseFilter.frequency.setTargetAtTime(currentProfile.freq * (0.8 + 0.6 * n), audioCtx.currentTime, 0.25);
        window._noiseFilter.Q.setTargetAtTime(currentProfile.q * (0.8 + 0.7 * n), audioCtx.currentTime, 0.25);
      }
    } else if (master && audioCtx && !soundOn) {
      master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
    }

    coreHaloGold.material.opacity = 0.09 + 0.04 * glow;
    coreHaloGold.scale.setScalar(2.5 + 0.4 * glow);
    coreGlowWarm.material.opacity = 0.20 + 0.06 * glow;
    coreGlowWarm.scale.setScalar(0.88 + 0.14 * glow);
    core.material.opacity = 0.50 + 0.10 * breath;
    core.scale.setScalar(0.21 + 0.03 * breath);

    stars.material.opacity = (0.95 + 0.05 * glowBoost) * 0.8;
    dust.material.opacity = (0.65 + 0.15 * glowBoost) * 0.8;

    if (topGlow.visible) {
      const p = 0.5 + 0.5 * Math.sin(t * 2.4);
      topGlow.material.opacity = 0.80 + 0.20 * p;
      topGlow.scale.setScalar(0.187 + 0.053 * p);
      topGlowHalo.material.opacity = 0.30 + 0.20 * p;
      topGlowHalo.scale.setScalar(0.433 + 0.100 * p);
    }

    const activeBtn = root.querySelector('#buttons button.active');
    if (activeBtn) {
      const pulse = 0.35 + 0.25 * Math.sin(t * 2.2);
      activeBtn.style.boxShadow = `0 0 16px rgba(255,255,255,${0.10 + 0.08 * pulse}), 0 3px 12px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.10)`;
    }

    surface.rotation.y = t * 0.18;
    surface.rotation.x = Math.sin(t * 0.12) * 0.18;

    if (sparks) {
      sparks.children.forEach((s, i) => {
        const a = s.userData.a + t * s.userData.sp;
        const r = s.userData.r + 0.08 * Math.sin(t * 0.7 + i);
        s.position.set(Math.cos(a) * r, Math.sin(t * 0.5 + i) * 0.35, Math.sin(a) * r);
        s.material.opacity = 0.32 + 0.32 * (0.5 + 0.5 * Math.sin(t * 1.5 + i));
      });
    }

    if (lines && !barthActive && !kummerActive) {
      const pulse = 0.85 + 0.15 * Math.sin(t * 1.8);
      lines.material.opacity = pulse;
      if (halo) halo.material.opacity = 0.1 + 0.1 * pulse;
    }
    if (dots && !barthActive && !kummerActive) {
      const pulse = 0.85 + 0.15 * Math.sin(t * 1.4 + 0.7);
      dots.material.opacity = 0.85 + 0.15 * pulse;
    }

    if (!barthActive && !cayleyActive && !clebschActive && !lopezActive && !kummerActive) {
      const swell = 1 + 0.022 * Math.sin(t * 0.53 + Math.sin(t * 0.19) * 0.6);
      const baseScale = scales[currentName] || 1;
      surface.scale.setScalar(baseScale * swell);

      if (currentName === 'Scherk2' && Math.abs(t - lastScherk2Formula) > 0.12) {
        lastScherk2Formula = t;
        setFormula('Scherk2');
      }

      if (currentName === 'López Klein' && Math.abs(t - lastLopezFormulaInternal) > 0.12) {
        lastLopezFormulaInternal = t;
        setFormula('López Klein');
      }

      if (current && lines && dots) {
        const { fn, nu, nv } = current;
        const pos = lines.geometry.attributes.position;
        const dpos = dots.geometry.attributes.position;
        let i = 0, di = 0;
        for (let j = 0; j <= nv; j++) {
          for (let ii = 0; ii <= nu; ii++) {
            const u = ii / nu, v = j / nv;
            const p = fn(u, v, k);
            pos.setXYZ(i, p.x, p.y, p.z);
            if (ii % 2 === 0 && j % 2 === 0 && di < dpos.count) { dpos.setXYZ(di, p.x, p.y, p.z); di++; }
            i++;
          }
        }
        pos.needsUpdate = true;
        dpos.needsUpdate = true;
        if (edgePts) {
          const epos = edgePts.geometry.attributes.position;
          let ei = 0;
          for (let ii = 0; ii <= nu && ei < epos.count; ii += 3) { const p = fn(ii / nu, 1, k); epos.setXYZ(ei, p.x, p.y, p.z); ei++; }
          for (let jj = 0; jj <= nv && ei < epos.count; jj += 3) { const p = fn(1, jj / nv, k); epos.setXYZ(ei, p.x, p.y, p.z); ei++; }
          epos.needsUpdate = true;
          edgePts.material.size = (0.28 + 0.10 * glow) * (edgeScales[currentName] || 1);
          edgePts.material.opacity = 0.85 + 0.15 * glow;
        }
        if (rim) {
          const rpos = rim.geometry.attributes.position;
          let ri = 0;
          const setR = (uu, vv) => { const p = fn(uu, vv, k); rpos.setXYZ(ri, p.x, p.y, p.z); ri++; };
          for (let ii = 0; ii <= nu; ii++) setR(ii / nu, 0);
          for (let jj = 1; jj <= nv; jj++) setR(1, jj / nv);
          for (let ii = nu - 1; ii >= 0; ii--) setR(ii / nu, 1);
          for (let jj = nv - 1; jj >= 1; jj--) setR(0, jj / nv);
          rpos.needsUpdate = true;
        }
        if (cornerPts) {
          const cpos = cornerPts.geometry.attributes.position;
          const corners = [[0,0],[1,0],[1,1],[0,1]];
          corners.forEach(([uu, vv], ci) => { const p = fn(uu, vv, k); cpos.setXYZ(ci, p.x, p.y, p.z); });
          cpos.needsUpdate = true;
          cornerPts.material.size = (0.093 + 0.033 * glow) * cornerScale;
          cornerPts.material.opacity = 0.92 + 0.08 * glow;
        }
      }
    } else if (barthActive) {
      const PERIOD_W = 24.0;
      const PERIOD_BREATH = 20.0;

      barthW = 0.95 + 0.17 * Math.sin(t * (2 * Math.PI / PERIOD_W));

      const rawBreath = 0.5 - 0.5 * Math.cos(t * (2 * Math.PI / PERIOD_BREATH));
      const easedBreath = rawBreath * rawBreath * (3 - 2 * rawBreath);
      barthBreathScale = 0.28 + 0.72 * easedBreath;

      if (t - lastBarthUpdate > BARTH_UPDATE_INTERVAL) {
        lastBarthUpdate = t;
        updateBarth(barthW);
      }

      if (Math.abs(t - lastBarthFormula) > 0.12) {
        lastBarthFormula = t;
        setFormula('Barth Sextic');
      }

      const inner = 1 + 0.010 * Math.sin(t * 1.1);
      surface.scale.setScalar((scales['Barth Sextic'] || 1.0) * barthBreathScale * inner);

      const brightPulse = 0.78 + 0.22 * Math.sin(t * 1.6);
      bLineMat.opacity = Math.max(0.5, Math.min(1.0, brightPulse + 0.08 * (barthW - 0.95)));

      const dotPulse = 0.85 + 0.15 * Math.sin(t * 1.9 + 0.7);
      bDotMat.opacity = 0.75 + 0.25 * dotPulse;
      bDotMat.size = BASE_BARTH_DOT * (1 + 0.15 * (0.5 + 0.5 * Math.sin(t * 1.4)));

      const edgePulse = 0.85 + 0.20 * Math.sin(t * 1.5 + 1.2);
      bEdgeMat.opacity = 0.80 + 0.20 * edgePulse;
      bEdgeMat.size = BASE_BARTH_EDGE * (1 + 0.20 * (0.5 + 0.5 * Math.sin(t * 1.2 + 0.4)));
    } else if (cayleyActive) {
      const phase = (t % CAYLEY_PERIOD) / CAYLEY_PERIOD;
      const smoothPhase = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      const cVal = 16 * smoothPhase;
      cayleyPhase = smoothPhase;

      if (t - lastCayleyUpdate > CAYLEY_UPDATE_INTERVAL) {
        lastCayleyUpdate = t;
        updateCayley(cVal);
      }

      const inner = 1 + 0.018 * Math.sin(t * 0.9) + 0.010 * Math.sin(t * 1.7);
      surface.scale.setScalar((scales['Cayley Cubic'] || 1.35) * inner);

      const intens = 0.55 + 0.55 * smoothPhase;
      const brightPulse = 0.78 + 0.22 * Math.sin(t * 1.7);
      cLineMat.opacity = Math.max(0.42, Math.min(1.0, brightPulse * intens));

      const dotPulse = 0.85 + 0.15 * Math.sin(t * 1.9 + 0.6);
      cDotMat.opacity = (0.70 + 0.30 * dotPulse) * (0.55 + 0.55 * smoothPhase);
      cDotMat.size = BASE_CAYLEY_DOT * (1 + 0.18 * (0.5 + 0.5 * Math.sin(t * 1.5)));

      const edgePulse = 0.85 + 0.18 * Math.sin(t * 1.4 + 1.1);
      cEdgeMat.opacity = (0.78 + 0.22 * edgePulse) * (0.6 + 0.5 * smoothPhase);
      cEdgeMat.size = BASE_CAYLEY_EDGE * (1 + 0.20 * (0.5 + 0.5 * Math.sin(t * 1.3 + 0.5)));

      if (Math.abs(t - lastCayleyFormula) > 0.12) {
        lastCayleyFormula = t;
        setFormula('Cayley Cubic');
      }
    } else if (kummerActive) {
      if (t - lastKummerUpdate > KUMMER_UPDATE_INTERVAL) {
        lastKummerUpdate = t;
        updateKummer(kummerLambda);
      }

      const inner = 1 + 0.015 * Math.sin(t * 1.1);
      surface.scale.setScalar((scales['Kummer Surface'] || 1.4) * inner);

      const brightPulse = 0.80 + 0.20 * Math.sin(t * 1.6);
      kLineMat.opacity = Math.max(0.55, Math.min(1.0, brightPulse));

      const dotPulse = 0.85 + 0.15 * Math.sin(t * 1.9 + 0.7);
      kDotMat.opacity = 0.80 + 0.20 * dotPulse;
      kDotMat.size = BASE_KUMMER_DOT * (1 + 0.15 * (0.5 + 0.5 * Math.sin(t * 1.4)));

      const edgePulse = 0.85 + 0.20 * Math.sin(t * 1.5 + 1.2);
      kEdgeMat.opacity = 0.82 + 0.18 * edgePulse;
      kEdgeMat.size = BASE_KUMMER_EDGE * (1 + 0.18 * (0.5 + 0.5 * Math.sin(t * 1.3 + 0.5)));
    } else if (clebschActive) {
      const breathPhaseC = t * (2 * Math.PI / 20.0);
      const rawBreath = 0.5 - 0.5 * Math.cos(breathPhaseC);
      const easedBreath = rawBreath * rawBreath * (3 - 2 * rawBreath);
      const breathScale = 0.82 + 0.18 * easedBreath;
      const inner = 1 + 0.010 * Math.sin(t * 1.1);
      surface.scale.setScalar((scales['Clebsch Cubic'] || 0.6) * breathScale * inner);

      const brightPulse = 0.78 + 0.22 * Math.sin(t * 1.6);
      clLineMat.opacity = Math.max(0.5, Math.min(1.0, brightPulse));

      const dotPulse = 0.85 + 0.15 * Math.sin(t * 1.9 + 0.7);
      clDotMat.opacity = 0.75 + 0.25 * dotPulse;
      clDotMat.size = BASE_CLEBSCH_DOT * (1 + 0.15 * (0.5 + 0.5 * Math.sin(t * 1.4)));

      const edgePulse = 0.85 + 0.20 * Math.sin(t * 1.5 + 1.2);
      clEdgeMat.opacity = 0.80 + 0.20 * edgePulse;
      clEdgeMat.size = BASE_CLEBSCH_EDGE * (1 + 0.20 * (0.5 + 0.5 * Math.sin(t * 1.2 + 0.4)));
    } else if (lopezActive) {
      if (t - lastLopezUpdate > LOPEZ_UPDATE_INTERVAL) {
        lastLopezUpdate = t;
        updateLopez(lopezE);
      }

      const inner = 1 + 0.015 * Math.sin(t * 1.05);
      surface.scale.setScalar((scales['López–Ros'] || 0.28) * inner * (1.0 / lopezE));

      const brightPulse = 0.80 + 0.20 * Math.sin(t * 1.55);
      lLineMat.opacity = Math.max(0.55, Math.min(1.0, brightPulse));

      const dotPulse = 0.85 + 0.15 * Math.sin(t * 1.9 + 0.6);
      lDotMat.opacity = 0.80 + 0.20 * dotPulse;
      lDotMat.size = BASE_LOPEZ_DOT * (1 + 0.15 * (0.5 + 0.5 * Math.sin(t * 1.4)));

      const edgePulse = 0.85 + 0.18 * Math.sin(t * 1.4 + 1.1);
      lEdgeMat.opacity = 0.82 + 0.18 * edgePulse;
      lEdgeMat.size = BASE_LOPEZ_EDGE * (1 + 0.18 * (0.5 + 0.5 * Math.sin(t * 1.3 + 0.5)));
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
